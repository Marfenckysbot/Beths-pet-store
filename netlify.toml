[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/marketplace"
  to = "/shop.html"
  status = 301

[[redirects]]
  from = "/seller"
  to = "/sell.html"
  status = 301

[[redirects]]
  from = "/care"
  to = "/care.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
